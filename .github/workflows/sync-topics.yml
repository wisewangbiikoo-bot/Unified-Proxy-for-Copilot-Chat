# Sync .github/repository-topics.txt → GitHub repo Topics (About section).
# Requires: repo or account "Workflow permissions" = Read and write
# (see docs/GITHUB_TOPICS_SETUP.zh-cn.md).
# Manual fallback: About → ⚙ → Topics (always works).
#
# IMPORTANT: Do not use invalid permission keys (e.g. `metadata: write`).
# GitHub silently schedules zero jobs and marks the run as failure
# ("No jobs were run"), which emails watchers on every push.

name: Sync repository topics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/repository-topics.txt
      - .github/workflows/sync-topics.yml

permissions:
  contents: read

jobs:
  topics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply repository topics via GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=()
          count=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            topic=$(echo "$line" | tr '[:upper:]' '[:lower:]' | xargs)
            [[ -z "$topic" ]] && continue
            [[ "$topic" =~ ^[a-z0-9][a-z0-9-]{0,48}[a-z0-9]$ ]] || [[ "$topic" =~ ^[a-z0-9]$ ]] || {
              echo "Skip invalid topic: $topic"
              continue
            }
            args+=(-f "names[]=${topic}")
            count=$((count + 1))
            [[ $count -ge 20 ]] && break
          done < .github/repository-topics.txt
          if [[ ${#args[@]} -eq 0 ]]; then
            echo "No valid topics in .github/repository-topics.txt"
            exit 1
          fi
          echo "Setting ${count} topic(s)..."
          gh api --method PUT "/repos/${GITHUB_REPOSITORY}/topics" -H "Accept: application/vnd.github+json" "${args[@]}"
          echo "Done. Verify at: https://github.com/${GITHUB_REPOSITORY}/topics"
