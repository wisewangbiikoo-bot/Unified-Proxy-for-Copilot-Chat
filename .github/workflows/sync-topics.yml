# Sync .github/repository-topics.txt → GitHub repo Topics (About section).
#
# NOTE: Default GITHUB_TOKEN cannot call PUT /repos/{repo}/topics
# (HTTP 403 "Resource not accessible by integration"). Prefer:
#   - Manual: About → ⚙ → Topics
#   - Local:  gh api --method PUT /repos/OWNER/REPO/topics -f names[]=...
# This workflow is workflow_dispatch-only so ordinary pushes do not email
# "Run failed". If you re-enable push, keep the 403 soft-exit below.

name: Sync repository topics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply repository topics via GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=()
          count=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            topic=$(echo "$line" | tr '[:upper:]' '[:lower:]' | xargs)
            [[ -z "$topic" ]] && continue
            [[ "$topic" =~ ^[a-z0-9][a-z0-9-]{0,48}[a-z0-9]$ ]] || [[ "$topic" =~ ^[a-z0-9]$ ]] || {
              echo "Skip invalid topic: $topic"
              continue
            }
            args+=(-f "names[]=${topic}")
            count=$((count + 1))
            [[ $count -ge 20 ]] && break
          done < .github/repository-topics.txt
          if [[ ${#args[@]} -eq 0 ]]; then
            echo "No valid topics in .github/repository-topics.txt"
            exit 1
          fi
          echo "Setting ${count} topic(s)..."
          if gh api --method PUT "/repos/${GITHUB_REPOSITORY}/topics" \
              -H "Accept: application/vnd.github+json" "${args[@]}"; then
            echo "Done. Verify at: https://github.com/${GITHUB_REPOSITORY}/topics"
          else
            echo "::warning::GITHUB_TOKEN cannot update topics (expected 403). Set topics via the About UI or a PAT with admin scope. See docs/GITHUB_TOPICS_SETUP.zh-cn.md"
            exit 0
          fi
